name: Build Test DMG

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: |
          cd packages/desktop
          npm run react-build
          npx electron-builder --mac dir --arm64

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - packages/desktop/dist/mac-arm64/env.app

      - name: Create test DMG
        run: |
          mkdir -p /tmp/env-test-dmg
          cp -R packages/desktop/dist/mac-arm64/env.app /tmp/env-test-dmg/
          ln -s /Applications /tmp/env-test-dmg/Applications
          hdiutil create \
            -volname "env test" \
            -srcfolder /tmp/env-test-dmg \
            -ov \
            -format UDZO \
            packages/desktop/dist/env-test.dmg

      - name: Upload test DMG
        uses: actions/upload-artifact@v4
        with:
          name: env-test-${{ github.sha }}
          path: packages/desktop/dist/env-test.dmg
          if-no-files-found: error
          retention-days: 14
