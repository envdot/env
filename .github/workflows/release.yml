name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build-mac:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 9

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build app bundle
        run: |
          cd packages/desktop
          npm run react-build
          npx electron-builder --mac dir

      - name: Ad-hoc sign
        run: codesign --force --deep --sign - packages/desktop/dist/mac-arm64/env.app

      - name: Create DMG with installer layout
        run: |
          mkdir -p /tmp/dmg-staging
          cp -R packages/desktop/dist/mac-arm64/env.app /tmp/dmg-staging/
          ln -s /Applications /tmp/dmg-staging/Applications
          cp packages/desktop/assets/icon.icns /tmp/dmg-staging/.VolumeIcon.icns
          hdiutil create -volname "env" -srcfolder /tmp/dmg-staging -ov -format UDRW -size 500m /tmp/env-rw.dmg
          DEV=$(hdiutil attach /tmp/env-rw.dmg -readwrite -noverify | grep '/Volumes/env' | tail -1 | awk '{print $1}')
          osascript <<'EOF'
          tell application "Finder"
            tell disk "env"
              open
              set current view of container window to icon view
              set toolbar visible of container window to false
              set statusbar visible of container window to false
              set bounds of container window to {100, 100, 640, 400}
              set viewOptions to the icon view options of container window
              set arrangement of viewOptions to not arranged
              set icon size of viewOptions to 80
              set position of item "env.app" of container window to {130, 150}
              set position of item "Applications" of container window to {410, 150}
              close
              open
              update without registering applications
              delay 2
              close
            end tell
          end tell
          EOF
          hdiutil detach /Volumes/env
          hdiutil convert /tmp/env-rw.dmg -format UDZO -o packages/desktop/dist/env.dmg

      - name: Upload to GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          gh release create "$TAG" --repo "$GITHUB_REPOSITORY" --title "$TAG" --generate-notes --verify-tag
          gh release upload "$TAG" packages/desktop/dist/env.dmg --repo "$GITHUB_REPOSITORY" --clobber
